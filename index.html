<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cobrinha Cúbica</title>
<style>
  :root{
    --bg:#0b0912;
    --panel:rgba(23,19,34,.86);
    --line:#332a4a;
    --ink:#eaf7d9;
    --muted:#8f86a6;
    --green:#9dff4d;
    --cyan:#4de1ff;
    --mint:#4dffb8;
    --gold:#ffd447;
    --red:#ff4d5e;
    --orange:#ff9f2e;
    --purple:#b78cff;
    --shadow:#05040a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%, #171226 0%, transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:"Courier New",ui-monospace,monospace;
    user-select:none;
    -webkit-user-select:none;
  }
  #scene{position:fixed;inset:0;touch-action:none}
  #scene canvas{display:block;width:100%;height:100%}
  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 45%, transparent 45%, rgba(4,3,8,.75) 100%);
  }
  .hud{
    position:fixed;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    padding:7px 12px;
    background:var(--panel);
    border:3px solid var(--line);
    box-shadow:5px 5px 0 var(--shadow);
    backdrop-filter:blur(2px);
  }
  .hud-top{top:12px;width:min(94vw,560px);display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
  .stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
  .stat.center{align-items:center;text-align:center}
  .stat.right{align-items:flex-end;text-align:right}
  .stat-label{font-size:clamp(7px,1.4vmin,10px);letter-spacing:.16em;color:var(--muted)}
  .stat-value{font-size:clamp(14px,2.9vmin,21px);font-weight:700;letter-spacing:.05em;color:var(--green);text-shadow:2px 2px 0 #000}
  #applesValue{color:var(--red)}
  #highValue{color:var(--ink)}
  .hud-effect{
    top:calc(12px + clamp(50px,7vmin,64px));
    gap:8px;font-size:clamp(7px,1.4vmin,10px);letter-spacing:.14em;
  }
  .effect-label{color:var(--muted)}
  .effect-value{color:var(--green);font-weight:700;letter-spacing:.1em;text-shadow:2px 2px 0 #000}
  .effect-swap{color:var(--muted);font-size:.9em}
  .hud-bottom{bottom:12px;width:min(94vw,560px);justify-content:space-between;min-height:34px}
  .effects{display:flex;gap:5px;flex-wrap:wrap}
  .chip{
    display:flex;align-items:center;gap:4px;padding:2px 4px;
    border:2px solid currentColor;font-size:clamp(6px,1.3vmin,8px);letter-spacing:.06em;
  }
  .chip-slow{color:var(--cyan)}
  .chip-shield{color:var(--mint)}
  .chip .bar{display:block;width:30px;height:5px;background:#0b0912;border:1px solid currentColor}
  .chip .bar span{display:block;height:100%;width:100%;background:currentColor}
  .mute{
    font-family:inherit;font-size:clamp(6px,1.3vmin,8px);letter-spacing:.06em;
    color:var(--muted);background:none;border:2px solid var(--line);
    padding:3px 6px;cursor:pointer;
  }
  .mute:hover{color:var(--ink);border-color:var(--muted)}
  .mute:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .help{
    position:fixed;bottom:calc(12px + 46px);left:50%;transform:translateX(-50%);
    margin:0;color:#6b6480;font-size:clamp(6px,1.2vmin,8px);
    letter-spacing:.1em;white-space:nowrap;
  }
  .banner{
    position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:6;
    min-width:52%;padding:8px 14px;text-align:center;pointer-events:none;
    background:rgba(10,8,16,.94);border:3px solid var(--green);
    box-shadow:4px 4px 0 rgba(0,0,0,.65);
    animation:bannerIn .16s steps(2);
  }
  .banner strong{display:block;color:var(--green);font-size:clamp(13px,2.6vmin,18px);letter-spacing:.12em}
  .banner span{display:block;margin-top:2px;color:var(--ink);font-size:clamp(8px,1.6vmin,10px);letter-spacing:.2em}
  @keyframes bannerIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
  .overlay{
    position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    padding:6vmin;background:rgba(8,6,14,.74);overflow:auto;outline:none;
  }
  .panel{
    width:100%;max-width:430px;display:flex;flex-direction:column;
    align-items:center;gap:clamp(6px,1.6vmin,12px);text-align:center;
  }
  .logo{margin:0;line-height:.9;color:var(--green);text-shadow:3px 3px 0 #17340c,6px 6px 0 #000}
  .logo-main{display:block;font-size:clamp(24px,5.8vmin,42px);letter-spacing:.02em}
  .logo-sub{display:block;margin-top:.22em;color:var(--ink);font-size:.55em;letter-spacing:.34em;text-shadow:2px 2px 0 #000}
  .tagline{margin:0;color:#b9b1cc;font-size:clamp(8px,1.6vmin,10px);letter-spacing:.12em;line-height:1.6;text-shadow:2px 2px 0 rgba(0,0,0,.85)}
  .best{font-size:clamp(8px,1.6vmin,10px);letter-spacing:.16em;color:var(--muted)}
  .best b{color:var(--gold);font-size:1.45em;letter-spacing:.06em;margin-left:.4em;text-shadow:2px 2px 0 #000}
  .kicker{margin:0;color:var(--red);font-size:clamp(8px,1.7vmin,10px);letter-spacing:.3em}
  .title{margin:0;line-height:.95;font-size:clamp(26px,6vmin,46px);text-shadow:3px 3px 0 #2a0f18,6px 6px 0 #000}
  .title.lose{color:var(--red)}
  .title.pause{color:var(--cyan);text-shadow:3px 3px 0 #062a33,6px 6px 0 #000}
  .cause{margin:0;color:var(--ink);font-size:clamp(8px,1.7vmin,10px);letter-spacing:.12em;line-height:1.5;text-shadow:2px 2px 0 rgba(0,0,0,.85)}
  .score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:300px}
  .score-grid div{background:#120f1c;border:2px solid var(--line);padding:4px 3px}
  .score-grid span{display:block;color:var(--muted);font-size:clamp(6px,1.3vmin,8px);letter-spacing:.1em}
  .score-grid b{display:block;color:var(--ink);font-size:clamp(11px,2.3vmin,15px);letter-spacing:.04em;margin-top:1px}
  .btn{
    font-family:inherit;font-size:clamp(11px,2.1vmin,14px);font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:#0b1905;background:var(--green);border:3px solid #eaffd0;
    box-shadow:4px 4px 0 #000;padding:clamp(7px,1.5vmin,10px) clamp(14px,3vmin,22px);
    cursor:pointer;transition:transform .05s steps(2), background .05s;
  }
  .btn:hover{background:#b8ff70}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
  .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .btn.secondary{background:var(--cyan);border-color:#d7f8ff}
  .hint{margin:0;color:#b3abc6;font-size:clamp(7px,1.45vmin,9px);letter-spacing:.1em;line-height:1.7;text-shadow:2px 2px 0 rgba(0,0,0,.85)}
  .hint b{color:var(--ink)}
  @media (max-width:560px){
    .help{display:none}
    .hud-bottom{justify-content:center}
  }
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div class="vignette"></div>

<header class="hud hud-top">
  <div class="stat">
    <span class="stat-label">SCORE</span>
    <span class="stat-value" id="scoreValue">000000</span>
  </div>
  <div class="stat center">
    <span class="stat-label">MAÇÃS</span>
    <span class="stat-value" id="applesValue">0</span>
  </div>
  <div class="stat right">
    <span class="stat-label">RECORDE</span>
    <span class="stat-value" id="highValue">000000</span>
  </div>
</header>

<div class="hud hud-effect">
  <span class="effect-label">FACE ATUAL</span>
  <span class="effect-value" id="effectValue">NEUTRA</span>
  <span class="effect-swap" id="swapValue">TROCA EM 3</span>
</div>

<div class="banner" id="banner" hidden aria-live="polite">
  <strong id="bannerTitle"></strong>
  <span id="bannerSub"></span>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Menu do jogo" tabindex="-1"></div>

<footer class="hud hud-bottom">
  <div class="effects">
    <div class="chip chip-slow" id="chipSlow" hidden><span>LENTO</span><span class="bar"><span></span></span></div>
    <div class="chip chip-shield" id="chipShield" hidden><span>ESCUDO</span><span class="bar"><span></span></span></div>
  </div>
  <button class="mute" id="muteBtn" type="button" aria-pressed="false">SOM ON</button>
</footer>
<p class="help">SETAS / WASD MOVEM NA DIREÇÃO DA TELA &middot; P PAUSA &middot; M SOM</p>

<script>
  /* Aviso amigável caso o Three.js (CDN) não carregue, por exemplo sem internet. */
  window.__cuboBoot = false;
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (window.__cuboBoot) return;
      const overlay = document.getElementById('overlay');
      const banner = document.getElementById('banner');
      if (banner) banner.hidden = true;
      overlay.hidden = false;
      overlay.innerHTML =
        '<div class="panel">' +
          '<p class="kicker">CARREGAMENTO</p>' +
          '<h2 class="title lose">SEM CONEXÃO</h2>' +
          '<p class="hint">O CUBO 3D USA O THREE.JS VIA CDN.<br>VERIFIQUE A INTERNET E RECARREGUE A PÁGINA.</p>' +
          '<button class="btn" type="button" onclick="location.reload()">TENTAR DE NOVO</button>' +
        '</div>';
    }, 7000);
  });
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

/* ============================================================
   COBRINHA CÚBICA — v2 (cubo 9x9 por face, modo infinito)
   ============================================================ */

/* ---------- CONFIG ---------- */
const N = 9;                 // células por face
const HALF = N / 2;          // 4.5
const CELL = 16;             // pixels por célula nas texturas
const TEX = N * CELL;        // 144
const TICK_START = 210;
const TICK_MIN = 95;
const TICK_STEP = 2;
const POWERUP_LIFE = 10000;
const EFFECT_TIME = 6000;
const SWAP_WARNING = 1500;
const HAZARD_WARNING = 1800;
const HAZARD_LIFE = 4200;
const FOG_RADIUS = 3;

/* Faces do cubo: normal n, eixos locais u (direita) e v (cima) */
const FACES = [
  { name:'FRENTE', n:[0,0,1],  u:[1,0,0],  v:[0,1,0]  },
  { name:'COSTAS', n:[0,0,-1], u:[-1,0,0], v:[0,1,0]  },
  { name:'DIREITA',n:[1,0,0],  u:[0,0,-1], v:[0,1,0]  },
  { name:'ESQUERDA',n:[-1,0,0],u:[0,0,1],  v:[0,1,0]  },
  { name:'TOPO',   n:[0,1,0],  u:[1,0,0],  v:[0,0,-1] },
  { name:'BASE',   n:[0,-1,0], u:[1,0,0],  v:[0,0,1]  }
];
const FACE_COUNT = FACES.length;

const EFFECT_KEYS = ['turbo','lama','gelo','portal','dourada','nevoa','instavel'];
const EFFECTS = {
  neutra:  { label:'NEUTRA',   color:'#9aa3b2', tint:'rgba(154,163,178,0.05)' },
  turbo:   { label:'TURBO',    color:'#ff9f2e', tint:'rgba(255,159,46,0.16)',  tick:0.55 },
  lama:    { label:'LAMA',     color:'#7ee04a', tint:'rgba(86,120,50,0.20)',   tick:1.5  },
  gelo:    { label:'GELO',     color:'#4de1ff', tint:'rgba(77,225,255,0.14)',  gelo:true },
  portal:  { label:'PORTAL',   color:'#b78cff', tint:'rgba(183,140,255,0.18)', portal:true },
  dourada: { label:'DOURADA',  color:'#ffd447', tint:'rgba(255,212,71,0.17)',  dourada:true },
  nevoa:   { label:'NÉVOA',    color:'#c3ccd8', tint:'rgba(10,12,20,0.42)',    nevoa:true },
  instavel:{ label:'INSTÁVEL', color:'#ff4d5e', tint:'rgba(255,77,94,0.16)',   instavel:true }
};

/* ---------- SPRITES 10x10 ---------- */
const APPLE = [
  '....ss....','....s.....','..ollll...','.orrrrrro.','orrrrrrrro',
  'orrhhrrrro','orrrrrrrro','orrrrrrrro','.orrrrrro.','..oooooo..'
];
const APPLE_COLORS = { o:'#3a0d17', r:'#ff4d5e', h:'#ffa1ac', s:'#7a4a2a', l:'#7ee04a' };
const APPLE_GOLD = ['....ss....','....s.....','..oyyyy...','.oyyyyyyo.','oyyyyyyyyo',
  'oyyywwyyyo','oyyyyyyyyo','oyyyyyyyyo','.oyyyyyyo.','..oooooo..'];
const APPLE_GOLD_COLORS = { o:'#4a3000', y:'#ffd447', w:'#fff3b0', s:'#7a4a2a' };
const STAR = ['....yy....','....yy....','...yyyy...','yyyywwyyyy','.yyyyyyyy.','..yyyyyy..','..yyyyyy..','.yyy..yyy.','.yy....yy.','..........'];
const STAR_COLORS = { y:'#ffd447', w:'#fff3b0' };
const CLOCK = ['..bbbbbb..','.bwwwwwwb.','bwwwwwwwwb','bwwwwwwwwb','bwwwdwwwwb','bwwwddwwwb','bwwwdwwwwb','bwwwwwwwwb','.bwwwwwwb.','..bbbbbb..'];
const CLOCK_COLORS = { b:'#4de1ff', w:'#dffaff', d:'#125a7a' };
const SHIELD = ['.gggggggg.','gggggggggg','gggwwggggg','gggwwggggg','gggggggggg','.gggggggg.','..gggggg..','...gggg...','....gg....','..........'];
const SHIELD_COLORS = { g:'#4dffb8', w:'#d6fff0' };
const POWERUPS = {
  star:   { sprite:STAR,   colors:STAR_COLORS,   glow:'#ffd447' },
  clock:  { sprite:CLOCK,  colors:CLOCK_COLORS,  glow:'#4de1ff' },
  shield: { sprite:SHIELD, colors:SHIELD_COLORS, glow:'#4dffb8' }
};
const EFFECT_ICONS = {
  turbo:['..oo..oo..','.oo..oo...','oo..oo...o','.oo..oo...','..oo..oo..','..........','.oo..oo...','oo..oo...o','.oo..oo...','..oo..oo..'],
  lama:['...gg.....','..gggg....','.gggggg...','..gggg....','....ggg...','..gggggg..','.ggggggg..','..gggg....','...gg.....','..........'],
  gelo:['....cc....','.c..cc..c.','..cccccc..','...cccc...','cccccccccc','...cccc...','..cccccc..','.c..cc..c.','....cc....','..........'],
  portal:['..pppppp..','.pp....pp.','pp......pp','p..pppp..p','p.pppppp.p','p.pppppp.p','p..pppp..p','pp......pp','.pp....pp.','..pppppp..'],
  dourada:['....yy....','...yyyy...','yyyywwyyyy','.yyyyyyyy.','..yyyyyy..','.yyy..yyy.','.yy....yy.','..........','..........','..........'],
  nevoa:['..........','...wwww...','..wwwwww..','.wwwwwwww.','wwwwwwwwww','.wwwwwwww.','..wwwwww..','...wwww...','..........','..........'],
  instavel:['....rr....','...rr.....','..rrrr....','.rrrrrrr..','....rr....','...rr.....','..rr......','.rr.......','rr........','..........'],
  neutra:['..........','..........','..........','..........','..........','..........','..........','..........','..........','..........']
};
const ICON_COLORS = {
  turbo:'#ff9f2e', lama:'#7ee04a', gelo:'#4de1ff', portal:'#b78cff',
  dourada:'#ffd447', nevoa:'#c3ccd8', instavel:'#ff4d5e', neutra:'#9aa3b2'
};

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const sceneWrap = $('scene');
const overlay = $('overlay');
const banner = $('banner');
const bannerTitle = $('bannerTitle');
const bannerSub = $('bannerSub');
const scoreValue = $('scoreValue');
const applesValue = $('applesValue');
const highValue = $('highValue');
const effectValue = $('effectValue');
const swapValue = $('swapValue');
const chipSlow = $('chipSlow');
const chipShield = $('chipShield');
const slowBar = chipSlow.querySelector('.bar span');
const shieldBar = chipShield.querySelector('.bar span');
const muteBtn = $('muteBtn');

/* ---------- PERSISTÊNCIA ---------- */
const store = {
  get(key, fallback) {
    try { const value = localStorage.getItem(key); return value === null ? fallback : value; }
    catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (_) {}
  }
};
let highScore = Math.max(0, parseInt(store.get('cobrinhaCubo.high', '0'), 10) || 0);
let muted = store.get('cobrinhaCubo.muted', '0') === '1';

/* ---------- MOVIMENTO REDUZIDO ---------- */
const reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduceMotion = !!(reduceQuery && reduceQuery.matches);
if (reduceQuery) {
  const onChange = (event) => { reduceMotion = event.matches; };
  if (reduceQuery.addEventListener) reduceQuery.addEventListener('change', onChange);
  else if (reduceQuery.addListener) reduceQuery.addListener(onChange);
}

/* ---------- ÁUDIO ---------- */
const audio = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (_) { return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(freq, dur = 0.06, type = 'square', vol = 0.03, delay = 0, slide = 0) {
    if (muted || !this.ctx) return;
    const c = this.ctx;
    const t = c.currentTime + delay;
    try {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (_) {}
  },
  eat()   { this.tone(660, 0.05, 'square', 0.035); this.tone(990, 0.06, 'square', 0.028, 0.05); },
  power() { [523, 659, 880].forEach((f, i) => this.tone(f, 0.07, 'square', 0.03, i * 0.055)); },
  swap()  { [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.07, 'triangle', 0.03, i * 0.05)); },
  portal(){ this.tone(280, 0.22, 'sine', 0.05, 0, 1200); },
  danger(){ this.tone(180, 0.12, 'sawtooth', 0.035); this.tone(150, 0.14, 'sawtooth', 0.03, 0.14); },
  hurt()  { this.tone(220, 0.16, 'sawtooth', 0.05); this.tone(110, 0.34, 'sawtooth', 0.045, 0.12, 50); },
  click() { this.tone(440, 0.035, 'square', 0.02); }
};

/* ---------- ESTADO ---------- */
let state = 'menu';            // menu | playing | paused | gameover
let score = 0;
let applesTotal = 0;
let snake = null;              // { cells:[{f,x,y}], dir:{x,y,z} }
let turns = [];                // fila de curvas (-1 esquerda, +1 direita)
let faceEffects = new Array(FACE_COUNT).fill('neutra');
let obstacles = [];            // { f, x, y } estáticos
let tempBlocks = [];           // { f, x, y, warnUntil, until }
let apple = null;              // { f, x, y }
let powerup = null;            // { f, x, y, type, expiresAt }
let hazard = null;             // { f, x, y, state:'warn'|'live', until }
let particles = [];
let effect = { slowUntil: 0, shieldUntil: 0 };
let gameTime = 0;
let animTime = 0;
let acc = 0;
let tickBase = TICK_START;
let swapsSince = 0;
let nextSwapAt = 3;
let swapWarningUntil = 0;
let nextHazardAt = 12000;
let deathCause = '';
let bannerTimer = 0;
let stateTimer = 0;
let swipeStart = null;
let pendingSwap = false;
let nextPowerupAt = 3;
let shakeUntil = 0;
let flashUntil = 0;

/* ---------- UTIL ---------- */
function pad(value) { return String(Math.max(0, Math.floor(value))).padStart(6, '0'); }
function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function cellKey(f, x, y) { return f * N * N + y * N + x; }

/* ---------- GEOMETRIA DO CUBO ---------- */
const faceVecs = FACES.map((face) => ({
  n: new THREE.Vector3(face.n[0], face.n[1], face.n[2]),
  u: new THREE.Vector3(face.u[0], face.u[1], face.u[2]),
  v: new THREE.Vector3(face.v[0], face.v[1], face.v[2])
}));

/* Giro (múltiplo de 90°, no plano da face) com que cada face é EXIBIDA.
   É reajustado a cada travessia para a minhoca continuar andando no mesmo
   sentido aparente na tela — o cubo rola e a face nova entra já na moldura
   certa. Sem isso, atravessar uma aresta podia inverter a direção na tela. */
const faceSpin = new Array(FACE_COUNT).fill(0);

function rot90(a, b, k) {
  k = ((k % 4) + 4) % 4;
  if (k === 0) return [a, b];
  if (k === 1) return [-b, a];
  if (k === 2) return [-a, -b];
  return [b, -a];
}

function spinToMatch(ea, eb, pa, pb) {
  for (let s = 0; s < 4; s++) {
    const r = rot90(ea, eb, -s);
    if (r[0] === pa && r[1] === pb) return s;
  }
  return 0;
}

/* Moldura em que a face é EXIBIDA: u' aponta para a direita da tela e v'
   para cima (é o que ancora o controle na tela, não no cubo). */
function presentedFrame(f, outU, outV) {
  const fv = faceVecs[f];
  const s = faceSpin[f] & 3;
  if (s === 0) {
    outU.copy(fv.u);
    outV.copy(fv.v);
  } else if (s === 1) {
    outU.copy(fv.v);
    outV.copy(fv.u).negate();
  } else if (s === 2) {
    outU.copy(fv.u).negate();
    outV.copy(fv.v).negate();
  } else {
    outU.copy(fv.v).negate();
    outV.copy(fv.u);
  }
}

function cellWorld(f, x, y, out) {
  const fv = faceVecs[f];
  const a = x - (N - 1) / 2;
  const b = y - (N - 1) / 2;
  out.copy(fv.n).multiplyScalar(HALF).addScaledVector(fv.u, a).addScaledVector(fv.v, b);
  return out;
}

function localOf(f, point) {
  const fv = faceVecs[f];
  return {
    x: Math.round(point.dot(fv.u)) + (N - 1) / 2,
    y: Math.round(point.dot(fv.v)) + (N - 1) / 2
  };
}

function faceIndexFromNormal(normal) {
  for (let i = 0; i < FACE_COUNT; i++) {
    if (faceVecs[i].n.distanceToSquared(normal) < 1e-6) return i;
  }
  return -1;
}

function crossEdge(f, x, y, dir) {
  const fv = faceVecs[f];
  const da = Math.round(dir.dot(fv.u));
  const db = Math.round(dir.dot(fv.v));
  const nx = x + da;
  const ny = y + db;
  let nextNormal;
  if (nx < 0) nextNormal = fv.u.clone().negate();
  else if (nx >= N) nextNormal = fv.u.clone();
  else if (ny < 0) nextNormal = fv.v.clone().negate();
  else nextNormal = fv.v.clone();
  const nf = faceIndexFromNormal(nextNormal);
  const point = cellWorld(f, x, y, new THREE.Vector3());
  point.addScaledVector(nextNormal, 0.5).addScaledVector(fv.n, -0.5);
  const local = localOf(nf, point);
  const newDir = fv.n.clone().negate();

  /* A direção do movimento (na moldura exibida) tem de continuar a mesma
     depois da travessia: escolhe-se a moldura da face de destino para isso. */
  const pa = dir.dot(fv.u);
  const pb = dir.dot(fv.v);
  const ap = rot90(pa, pb, -faceSpin[f]);
  const tv = faceVecs[nf];
  faceSpin[nf] = spinToMatch(newDir.dot(tv.u), newDir.dot(tv.v), ap[0], ap[1]);
  kickWobble();

  return { f: nf, x: local.x, y: local.y, dir: newDir };
}

function advanceToEdge(f, x, y, dir) {
  const fv = faceVecs[f];
  const da = Math.round(dir.dot(fv.u));
  const db = Math.round(dir.dot(fv.v));
  let ex = x;
  let ey = y;
  if (da) ex = da > 0 ? (N - 1) : 0;
  if (db) ey = db > 0 ? (N - 1) : 0;
  return { f, x: ex, y: ey };
}

function computeStep() {
  const head = snake.cells[0];
  const fv = faceVecs[head.f];
  const da = Math.round(snake.dir.dot(fv.u));
  const db = Math.round(snake.dir.dot(fv.v));
  const x = head.x + da;
  const y = head.y + db;

  if (x >= 0 && x < N && y >= 0 && y < N) {
    return { f: head.f, x, y, dir: snake.dir.clone(), portalUsed: false };
  }

  const eff = EFFECTS[faceEffects[head.f]];
  if (eff.portal) {
    const first = crossEdge(head.f, head.x, head.y, snake.dir);
    const edge = advanceToEdge(first.f, first.x, first.y, first.dir);
    const second = crossEdge(edge.f, edge.x, edge.y, first.dir);
    return { f: second.f, x: second.x, y: second.y, dir: second.dir, portalUsed: true };
  }

  const crossed = crossEdge(head.f, head.x, head.y, snake.dir);
  return { f: crossed.f, x: crossed.x, y: crossed.y, dir: crossed.dir, portalUsed: false };
}

/* Controle ancorado na TELA: a seta aponta para a direção desejada na face
   exibida (↑ sobe na tela, ↓ desce, ← esquerda, → direita), independente de
   como a face/cubo girou. Cada toque vira uma volta de 90° na fila. */
const inWant = new THREE.Vector3();
const inEff = new THREE.Vector3();
const inStep = new THREE.Vector3();
const inLeft = new THREE.Vector3();

function inputDir(su, sv) {
  if (!snake || state !== 'playing' || turns.length >= 2) return;
  const head = snake.cells[0];
  const fv = faceVecs[head.f];
  presentedFrame(head.f, presU, presV);
  inWant.copy(presU).multiplyScalar(su).addScaledVector(presV, sv).normalize();

  /* direção efetiva já considerando as voltas que estão na fila */
  inEff.copy(snake.dir);
  for (let i = 0; i < turns.length; i++) {
    if (turns[i] < 0) inStep.crossVectors(fv.n, inEff);
    else inStep.crossVectors(inEff, fv.n);
    inEff.copy(inStep).round();
  }

  const dot = inEff.dot(inWant);
  if (dot > 0.5) return;    /* já está indo para lá */
  if (dot < -0.5) return;   /* inverter 180° não vale */

  /* 90°: entra na fila a volta que leva à direção pedida */
  inLeft.crossVectors(fv.n, inEff).round();
  turns.push(inLeft.dot(inWant) > 0.5 ? -1 : 1);
}
function applyTurn(sign) {
  const head = snake.cells[0];
  const fv = faceVecs[head.f];
  const next = new THREE.Vector3();
  if (sign < 0) next.crossVectors(fv.n, snake.dir);
  else next.crossVectors(snake.dir, fv.n);
  next.round();
  snake.dir.copy(next);
}

/* ---------- COLISÕES ---------- */
function isBlockAt(f, x, y) {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.f === f && o.x === x && o.y === y) return true;
  }
  for (let i = 0; i < tempBlocks.length; i++) {
    const b = tempBlocks[i];
    if (b.f === f && b.x === x && b.y === y && animTime >= b.warnUntil) return true;
  }
  return false;
}

function isHazardAt(f, x, y) {
  if (!hazard || hazard.state !== 'live') return false;
  return f === hazard.f && x >= hazard.x && x < hazard.x + 3 && y >= hazard.y && y < hazard.y + 3;
}

function isOnSnake(f, x, y) {
  for (let i = 0; i < snake.cells.length; i++) {
    const c = snake.cells[i];
    if (c.f === f && c.x === x && c.y === y) return true;
  }
  return false;
}

function randomFreeCell() {
  const occupied = new Set();
  for (let i = 0; i < snake.cells.length; i++) {
    const c = snake.cells[i];
    occupied.add(cellKey(c.f, c.x, c.y));
  }
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    occupied.add(cellKey(o.f, o.x, o.y));
  }
  for (let i = 0; i < tempBlocks.length; i++) {
    const b = tempBlocks[i];
    if (animTime < b.until) occupied.add(cellKey(b.f, b.x, b.y));
  }
  if (apple) occupied.add(cellKey(apple.f, apple.x, apple.y));
  if (powerup) occupied.add(cellKey(powerup.f, powerup.x, powerup.y));
  if (hazard) {
    for (let y = hazard.y; y < hazard.y + 3; y++) {
      for (let x = hazard.x; x < hazard.x + 3; x++) occupied.add(cellKey(hazard.f, x, y));
    }
  }
  const free = [];
  for (let f = 0; f < FACE_COUNT; f++) {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!occupied.has(cellKey(f, x, y))) free.push({ f, x, y });
      }
    }
  }
  return free.length ? free[(Math.random() * free.length) | 0] : null;
}

/* ---------- SPAWN E EFEITOS ---------- */
function spawnApple() {
  const cell = randomFreeCell();
  apple = cell ? { f: cell.f, x: cell.x, y: cell.y } : null;
}

function maybeSpawnPowerup() {
  if (powerup || applesTotal < nextPowerupAt) return;
  const cell = randomFreeCell();
  if (!cell) return;
  powerup = {
    f: cell.f, x: cell.x, y: cell.y,
    type: pick(['star', 'clock', 'shield']),
    expiresAt: gameTime + POWERUP_LIFE
  };
  nextPowerupAt = applesTotal + randInt(3, 5);
}

function assignEffects(initial) {
  const previous = faceEffects.slice();
  const pool = EFFECT_KEYS.slice();
  const chosen = [];
  while (chosen.length < FACE_COUNT - 1 && pool.length) {
    chosen.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  }
  const neutralFace = (Math.random() * FACE_COUNT) | 0;
  const next = new Array(FACE_COUNT).fill('neutra');
  let k = 0;
  for (let f = 0; f < FACE_COUNT; f++) {
    if (f !== neutralFace) next[f] = chosen[k++];
  }
  if (!initial) {
    for (let pass = 0; pass < 6; pass++) {
      for (let f = 0; f < FACE_COUNT; f++) {
        if (next[f] !== previous[f]) continue;
        for (let g = 0; g < FACE_COUNT; g++) {
          if (g === f) continue;
          if (next[g] === previous[f]) continue;
          if (next[f] === previous[g]) continue;
          const swap = next[f];
          next[f] = next[g];
          next[g] = swap;
          break;
        }
      }
    }
  }
  faceEffects = next;
}

function generateObstacles() {
  const list = [];
  const used = new Set();
  for (let i = 0; i < snake.cells.length; i++) {
    const c = snake.cells[i];
    used.add(cellKey(c.f, c.x, c.y));
  }
  for (let f = 0; f < FACE_COUNT; f++) {
    const count = 4 + randInt(0, 2);
    let made = 0;
    let guard = 0;
    while (made < count && guard < 240) {
      guard++;
      const x = randInt(0, N - 1);
      const y = randInt(0, N - 1);
      const key = cellKey(f, x, y);
      if (used.has(key)) continue;
      if (f === 0 && y === 4) continue;
      if (f === 0 && x <= 5 && Math.abs(y - 4) <= 1) continue;
      if (f === 2 && x === 0 && Math.abs(y - 4) <= 1) continue;
      let close = false;
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        if (o.f !== f) continue;
        if (Math.max(Math.abs(o.x - x), Math.abs(o.y - y)) < 3) { close = true; break; }
      }
      if (close) continue;
      list.push({ f, x, y });
      used.add(key);
      made++;
    }
  }
  return list;
}

/* ---------- FLUXO ---------- */
function addScore(points) {
  score += points;
  if (score > highScore) {
    highScore = score;
    store.set('cobrinhaCubo.high', highScore);
  }
  updateHUD();
}

function collectPowerup() {
  if (!powerup) return;
  const collected = powerup;
  powerup = null;
  const def = POWERUPS[collected.type];
  audio.power();
  spawnParticles(collected.f, collected.x, collected.y, [def.glow, '#fff3b0', '#eaf7d9'], 12);
  if (collected.type === 'star') {
    addScore(50);
  } else if (collected.type === 'clock') {
    effect.slowUntil = gameTime + EFFECT_TIME;
  } else {
    effect.shieldUntil = gameTime + EFFECT_TIME;
  }
  updateHUD();
}

function startGame() {
  audio.ensure();
  clearTimeout(stateTimer);
  clearTimeout(bannerTimer);
  banner.hidden = true;
  initWorld();
  state = 'playing';
  hideOverlay();
  updateHUD();
  showBanner('CUBO 9×9', '6 FACES · MODO INFINITO', 1600);
  syncCube(true);
}

function die(cause) {
  if (state !== 'playing') return;
  state = 'gameover';
  deathCause = cause;
  acc = 0;
  turns = [];
  audio.hurt();
  shakeUntil = animTime + 300;
  flashUntil = animTime + 220;
  const head = snake.cells[0];
  spawnParticles(head.f, head.x, head.y, ['#ff4d5e', '#9dff4d', '#ffd447'], 16);
  if (score > highScore) {
    highScore = score;
    store.set('cobrinhaCubo.high', highScore);
  }
  updateHUD();
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => {
    if (state === 'gameover') showOverlay('gameover');
  }, 560);
}

function currentTick() {
  const head = snake.cells[0];
  const eff = EFFECTS[faceEffects[head.f]];
  let interval = Math.max(TICK_MIN, tickBase);
  if (eff.tick) interval *= eff.tick;
  if (gameTime < effect.slowUntil) interval *= 1.6;
  return Math.min(520, Math.max(70, interval));
}

function step() {
  if (state !== 'playing') return;
  const head = snake.cells[0];
  const eff = EFFECTS[faceEffects[head.f]];

  if (turns.length) {
    const turn = turns.shift();
    /* no gelo a cobra derrapa: a volta é descartada, não fica presa na fila */
    if (!eff.gelo) applyTurn(turn);
  }

  const moved = computeStep();

  if (moved.portalUsed) {
    audio.portal();
    spawnParticles(head.f, head.x, head.y, ['#b78cff', '#e6d8ff', '#4de1ff'], 14);
    spawnParticles(moved.f, moved.x, moved.y, ['#b78cff', '#e6d8ff', '#4de1ff'], 14);
    showBanner('PORTAL!', 'TELEPORTE PARA A FACE OPOSTA', 1100);
  }

  const eats = !!apple && apple.f === moved.f && apple.x === moved.x && apple.y === moved.y;

  if (isBlockAt(moved.f, moved.x, moved.y)) { die('VOCÊ BATEU NOS BLOCOS'); return; }
  if (isHazardAt(moved.f, moved.x, moved.y)) { die('VOCÊ PISOU NA ZONA DE PERIGO'); return; }

  const bodyToCheck = eats ? snake.cells : snake.cells.slice(0, -1);
  let hitsSelf = false;
  for (let i = 0; i < bodyToCheck.length; i++) {
    const c = bodyToCheck[i];
    if (c.f === moved.f && c.x === moved.x && c.y === moved.y) { hitsSelf = true; break; }
  }
  if (hitsSelf && gameTime >= effect.shieldUntil) {
    die('VOCÊ MORDEU O PRÓPRIO CORPO');
    return;
  }

  snake.dir.copy(moved.dir);
  snake.cells.unshift({ f: moved.f, x: moved.x, y: moved.y });
  if (!eats) snake.cells.pop();

  if (eats) {
    const golden = EFFECTS[faceEffects[moved.f]].dourada;
    applesTotal += 1;
    addScore(golden ? 20 : 10);
    tickBase = Math.max(TICK_MIN, TICK_START - applesTotal * TICK_STEP);
    audio.eat();
    spawnParticles(moved.f, moved.x, moved.y,
      golden ? ['#ffd447', '#fff3b0', '#ff9f2e'] : ['#ff4d5e', '#ff9fa5', '#ffd447'], 10);
    apple = null;
    swapsSince += 1;
    if (!pendingSwap && swapsSince >= nextSwapAt) {
      pendingSwap = true;
      swapWarningUntil = gameTime + SWAP_WARNING;
      audio.swap();
      showBanner('EFEITOS MUDANDO!', 'AS FACES VÃO VIRAR', SWAP_WARNING);
    }
    spawnApple();
    maybeSpawnPowerup();
  }

  const collects = !!powerup && powerup.f === moved.f && powerup.x === moved.x && powerup.y === moved.y;
  if (collects) collectPowerup();

  updateHUD();
}

function updateHUD() {
  scoreValue.textContent = pad(score);
  highValue.textContent = pad(highScore);
  applesValue.textContent = String(applesTotal);
  const faceIndex = snake ? snake.cells[0].f : 0;
  const eff = EFFECTS[faceEffects[faceIndex]];
  effectValue.textContent = eff.label;
  effectValue.style.color = eff.color;
  swapValue.textContent = pendingSwap
    ? 'TROCANDO…'
    : 'TROCA EM ' + Math.max(0, nextSwapAt - swapsSince);
}

function updateEffectBars() {
  const slowLeft = Math.max(0, effect.slowUntil - gameTime);
  const shieldLeft = Math.max(0, effect.shieldUntil - gameTime);
  chipSlow.hidden = slowLeft <= 0;
  chipShield.hidden = shieldLeft <= 0;
  slowBar.style.width = slowLeft > 0 ? (slowLeft / EFFECT_TIME * 100) + '%' : '0%';
  shieldBar.style.width = shieldLeft > 0 ? (shieldLeft / EFFECT_TIME * 100) + '%' : '0%';
}

/* ---------- TEXTURAS DAS FACES ---------- */
const faceCanvases = [];
const faceTextures = [];
for (let f = 0; f < FACE_COUNT; f++) {
  const canvas = document.createElement('canvas');
  canvas.width = TEX;
  canvas.height = TEX;
  const context = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.colorSpace = THREE.SRGBColorSpace;
  faceCanvases.push({ canvas, context });
  faceTextures.push(texture);
}

function drawSprite(ctx, matrix, ox, oy, palette, override) {
  for (let y = 0; y < matrix.length; y++) {
    const row = matrix[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row.charAt(x);
      if (ch === '.' || ch === ' ') continue;
      const color = override || palette[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}

function drawBase(ctx) {
  ctx.fillStyle = '#1a1429';
  ctx.fillRect(0, 0, TEX, TEX);
  ctx.fillStyle = '#221a38';
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, (N - 1 - y) * CELL, CELL, CELL);
    }
  }
  ctx.fillStyle = 'rgba(120,100,170,0.10)';
  for (let i = 1; i < N; i++) {
    ctx.fillRect(i * CELL, 0, 1, TEX);
    ctx.fillRect(0, i * CELL, TEX, 1);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fillRect(0, 0, TEX, 2);
  ctx.fillRect(0, TEX - 2, TEX, 2);
  ctx.fillRect(0, 0, 2, TEX);
  ctx.fillRect(TEX - 2, 0, 2, TEX);
}

function drawEffectTint(ctx, key) {
  if (key === 'neutra') return;
  const eff = EFFECTS[key];
  ctx.fillStyle = eff.tint;
  ctx.fillRect(0, 0, TEX, TEX);
  if (key === 'portal') {
    ctx.strokeStyle = 'rgba(183,140,255,0.35)';
    ctx.lineWidth = 3;
    const t = (animTime / 400) % 1;
    const inset = 10 + t * 44;
    ctx.strokeRect(inset, inset, TEX - inset * 2, TEX - inset * 2);
  } else if (key === 'turbo') {
    ctx.fillStyle = 'rgba(255,159,46,0.16)';
    const off = Math.floor((animTime / 120) % 16);
    for (let k = -16; k < TEX + 16; k += 16) {
      ctx.fillRect(k + off, 0, 3, TEX);
    }
  } else if (key === 'lama') {
    ctx.fillStyle = 'rgba(60,90,30,0.20)';
    for (let y = 0; y < N; y += 2) {
      for (let x = (y / 2) % 2; x < N; x += 3) {
        ctx.fillRect(x * CELL + 4, (N - 1 - y) * CELL + 4, 6, 6);
      }
    }
  } else if (key === 'gelo') {
    ctx.strokeStyle = 'rgba(77,225,255,0.22)';
    ctx.lineWidth = 2;
    for (let k = -TEX; k < TEX; k += 24) {
      ctx.beginPath();
      ctx.moveTo(k, 0);
      ctx.lineTo(k + TEX, TEX);
      ctx.stroke();
    }
  } else if (key === 'instavel') {
    ctx.fillStyle = 'rgba(255,77,94,0.16)';
    for (let y = 0; y < N; y += 3) {
      ctx.fillRect(0, (N - 1 - y) * CELL + 5, TEX, 2);
    }
  }
  drawSprite(ctx, EFFECT_ICONS[key], 4, 4, {}, ICON_COLORS[key]);
}

function drawBrick(ctx, x, y) {
  const px = x * CELL;
  const py = (N - 1 - y) * CELL;
  const tone = (x * 7 + y * 13) % 3;
  ctx.fillStyle = tone === 0 ? '#413758' : tone === 1 ? '#463b5e' : '#3c3352';
  ctx.fillRect(px, py, CELL, CELL);
  ctx.fillStyle = '#5b4f77';
  ctx.fillRect(px, py, CELL, 2);
  ctx.fillRect(px, py, 2, CELL);
  ctx.fillStyle = '#2c2540';
  ctx.fillRect(px, py + CELL - 2, CELL, 2);
  ctx.fillRect(px + CELL - 2, py, 2, CELL);
  ctx.fillStyle = '#332b47';
  ctx.fillRect(px + 2, py + 8, 12, 1);
  ctx.fillRect(px + 7, py + 2, 1, 6);
  ctx.fillRect(px + 11, py + 9, 1, 5);
  if (tone === 0) {
    ctx.fillStyle = '#6b5e8a';
    ctx.fillRect(px + 3, py + 3, 1, 1);
  }
}

function drawAppleSprite(ctx, x, y, golden) {
  const bob = reduceMotion ? 0 : (Math.floor(animTime / 380) % 2);
  const px = x * CELL + 3;
  const py = (N - 1 - y) * CELL + 2 + bob;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x * CELL + 4, (N - 1 - y) * CELL + 15, 8, 1);
  drawSprite(ctx, golden ? APPLE_GOLD : APPLE, px, py, golden ? APPLE_GOLD_COLORS : APPLE_COLORS);
}

function drawPowerupSprite(ctx, pu) {
  const left = pu.expiresAt - gameTime;
  if (left < 3000 && Math.floor(gameTime / 140) % 2 === 0) return;
  const def = POWERUPS[pu.type];
  const bob = reduceMotion ? 0 : (Math.floor(animTime / 300) % 2);
  const px = pu.x * CELL + 3;
  const py = (N - 1 - pu.y) * CELL + 3 + bob;
  drawSprite(ctx, def.sprite, px + 1, py + 1, def.colors, '#120c18');
  drawSprite(ctx, def.sprite, px, py, def.colors);
}

function drawHazardZone(ctx, hz) {
  const live = hz.state === 'live';
  const blink = Math.floor(animTime / 150) % 2 === 0;
  if (!live && !blink) return;
  for (let y = hz.y; y < hz.y + 3; y++) {
    for (let x = hz.x; x < hz.x + 3; x++) {
      const px = x * CELL;
      const py = (N - 1 - y) * CELL;
      if (live) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(px, py, CELL, CELL);
        ctx.clip();
        ctx.fillStyle = 'rgba(255,77,94,0.42)';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.fillStyle = 'rgba(255,159,46,0.35)';
        const off = Math.floor((animTime / 90) % 16);
        for (let k = -16; k < 32; k += 8) {
          ctx.fillRect(px + k + off, py - 2, 3, CELL + 4);
        }
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(255,212,71,0.26)';
        ctx.fillRect(px, py, CELL, CELL);
      }
    }
  }
  ctx.strokeStyle = live ? '#ff4d5e' : '#ffd447';
  ctx.lineWidth = 3;
  ctx.strokeRect(hz.x * CELL + 1.5, (N - 1 - (hz.y + 2)) * CELL + 1.5, 3 * CELL - 3, 3 * CELL - 3);
}

function drawSnakeCell(ctx, x, y, index, isHead, isTail) {
  const px = x * CELL;
  const py = (N - 1 - y) * CELL;
  const inset = isTail ? 2 : 1;
  const size = CELL - inset * 2;

  ctx.fillStyle = isHead ? '#17340c' : '#142d0a';
  ctx.fillRect(px + inset - 1, py + inset - 1, size + 2, size + 2);
  ctx.fillStyle = isHead ? '#a6ff4f' : (index % 2 === 0 ? '#7ee04a' : '#66c62f');
  ctx.fillRect(px + inset, py + inset, size, size);
  ctx.fillStyle = isHead ? '#d1ff9e' : '#9bef62';
  ctx.fillRect(px + inset, py + inset, size, 2);
  ctx.fillRect(px + inset, py + inset, 2, size);
  ctx.fillStyle = isHead ? '#78c92e' : '#4fa224';
  ctx.fillRect(px + inset, py + inset + size - 2, size, 2);
  ctx.fillRect(px + inset + size - 2, py + inset, 2, size);
  if (!isHead && !isTail) {
    ctx.fillStyle = 'rgba(20,55,8,0.16)';
    ctx.fillRect(px + inset + 5, py + inset + 5, 2, 2);
  }
}

function drawSnakeFace(ctx, head, dir) {
  const fv = faceVecs[head.f];
  const du = Math.round(dir.dot(fv.u));
  const dv = Math.round(dir.dot(fv.v));
  let eyes, pdx, pdy;
  if (du > 0) { eyes = [[10, 4], [10, 9]]; pdx = 1; pdy = 1; }
  else if (du < 0) { eyes = [[1, 4], [1, 9]]; pdx = 0; pdy = 1; }
  else if (dv > 0) { eyes = [[4, 1], [9, 1]]; pdx = 1; pdy = 0; }
  else { eyes = [[4, 10], [9, 10]]; pdx = 1; pdy = 1; }

  const ox = head.x * CELL;
  const oy = (N - 1 - head.y) * CELL;
  for (let i = 0; i < eyes.length; i++) {
    const ex = ox + eyes[i][0];
    const ey = oy + eyes[i][1];
    ctx.fillStyle = '#f0ffe0';
    ctx.fillRect(ex, ey, 3, 3);
    ctx.fillStyle = '#0b1c05';
    ctx.fillRect(ex + pdx, ey + pdy, 2, 2);
  }

  if (!reduceMotion && Math.floor(animTime / 450) % 2 === 0) {
    ctx.fillStyle = '#ff4d5e';
    if (du > 0) {
      ctx.fillRect(ox + 14, oy + 7, 2, 1);
      ctx.fillRect(ox + 16, oy + 5, 1, 2);
      ctx.fillRect(ox + 16, oy + 8, 1, 2);
    } else if (du < 0) {
      ctx.fillRect(ox, oy + 7, 2, 1);
      ctx.fillRect(ox - 2, oy + 5, 1, 2);
      ctx.fillRect(ox - 2, oy + 8, 1, 2);
    } else if (dv > 0) {
      ctx.fillRect(ox + 7, oy, 1, 2);
      ctx.fillRect(ox + 5, oy - 2, 2, 1);
      ctx.fillRect(ox + 8, oy - 2, 2, 1);
    } else {
      ctx.fillRect(ox + 7, oy + 14, 1, 2);
      ctx.fillRect(ox + 5, oy + 16, 2, 1);
      ctx.fillRect(ox + 8, oy + 16, 2, 1);
    }
  }
}

function drawShieldRing(ctx, x, y) {
  const px = x * CELL;
  const py = (N - 1 - y) * CELL;
  const pulse = reduceMotion ? 0 : Math.floor(animTime / 120) % 2;
  ctx.fillStyle = pulse ? '#4dffb8' : '#d6fff0';
  ctx.fillRect(px, py, CELL, 1);
  ctx.fillRect(px, py + CELL - 1, CELL, 1);
  ctx.fillRect(px, py, 1, CELL);
  ctx.fillRect(px + CELL - 1, py, 1, CELL);
  ctx.fillStyle = '#4dffb8';
  ctx.fillRect(px + 2, py + 2, 2, 2);
  ctx.fillRect(px + CELL - 4, py + 2, 2, 2);
  ctx.fillRect(px + 2, py + CELL - 4, 2, 2);
  ctx.fillRect(px + CELL - 4, py + CELL - 4, 2, 2);
}

function drawFog(ctx, f) {
  const head = snake.cells[0];
  const onHeadFace = head.f === f;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let visible = false;
      if (onHeadFace) {
        visible = Math.max(Math.abs(x - head.x), Math.abs(y - head.y)) <= FOG_RADIUS;
      }
      if (!visible) {
        ctx.fillStyle = 'rgba(6,8,14,0.9)';
        ctx.fillRect(x * CELL, (N - 1 - y) * CELL, CELL, CELL);
      }
    }
  }
}

function spawnParticles(f, x, y, colors, count = 8) {
  const total = reduceMotion ? Math.min(count, 3) : count;
  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 3.2;
    particles.push({
      f, x: x + 0.5, y: y + 0.5,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.35 + Math.random() * 0.35,
      color: colors[i % colors.length],
      size: Math.random() < 0.35 ? 2 : 3
    });
  }
  if (particles.length > 220) particles.splice(0, particles.length - 220);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy -= 4 * dt;
  }
}

function drawParticles(ctx, f) {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.f !== f) continue;
    ctx.globalAlpha = Math.max(0.15, Math.min(1, p.life * 3));
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x * CELL - p.size / 2), Math.round((N - p.y) * CELL - p.size / 2), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawFace(f) {
  const ctx = faceCanvases[f].context;
  drawBase(ctx);
  drawEffectTint(ctx, faceEffects[f]);

  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.f === f) drawBrick(ctx, o.x, o.y);
  }
  for (let i = 0; i < tempBlocks.length; i++) {
    const b = tempBlocks[i];
    if (b.f !== f) continue;
    if (animTime < b.warnUntil) {
      if (Math.floor(animTime / 140) % 2 === 0) {
        const px = b.x * CELL;
        const py = (N - 1 - b.y) * CELL;
        ctx.fillStyle = 'rgba(255,77,94,0.25)';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.strokeStyle = '#ff4d5e';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
      }
    } else if (animTime < b.until) {
      drawBrick(ctx, b.x, b.y);
    }
  }
  if (hazard && hazard.f === f) drawHazardZone(ctx, hazard);
  if (apple && apple.f === f) drawAppleSprite(ctx, apple.x, apple.y, EFFECTS[faceEffects[f]].dourada);
  if (powerup && powerup.f === f) drawPowerupSprite(ctx, powerup);

  const head = snake.cells[0];
  for (let i = snake.cells.length - 1; i >= 0; i--) {
    const c = snake.cells[i];
    if (c.f !== f) continue;
    drawSnakeCell(ctx, c.x, c.y, i, i === 0, i === snake.cells.length - 1 && snake.cells.length > 1);
  }
  if (head.f === f) {
    drawSnakeFace(ctx, head, snake.dir);
    if (gameTime < effect.shieldUntil) drawShieldRing(ctx, head.x, head.y);
  }

  drawParticles(ctx, f);
  if (faceEffects[f] === 'nevoa') drawFog(ctx, f);

  if (pendingSwap && Math.floor(animTime / 150) % 2 === 0) {
    ctx.strokeStyle = '#9dff4d';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, TEX - 4, TEX - 4);
  }
  if (animTime < flashUntil) {
    ctx.fillStyle = 'rgba(255,77,94,0.3)';
    ctx.fillRect(0, 0, TEX, TEX);
  }
  faceTextures[f].needsUpdate = true;
}

/* ---------- CENA 3D ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
sceneWrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0912');

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 300);
const CAM_DIR = new THREE.Vector3(13.5, 10.5, 15.5).normalize();
const CAM_DIST_BASE = Math.hypot(13.5, 10.5, 15.5);
let camDist = CAM_DIST_BASE;

function computeCamDist() {
  const aspect = window.innerWidth / window.innerHeight;
  const halfFov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const need = 13.6 / (2 * Math.tan(halfFov) * Math.min(1, aspect));
  return Math.min(CAM_DIST_BASE * 1.6, Math.max(CAM_DIST_BASE, need));
}

camDist = computeCamDist();
camera.position.copy(CAM_DIR).multiplyScalar(camDist);
camera.lookAt(0, 0, 0);

const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

const FACE_SHADE = [1.02, 0.72, 0.86, 0.78, 1.08, 0.62];
const faceMeshes = [];
for (let f = 0; f < FACE_COUNT; f++) {
  const geometry = new THREE.PlaneGeometry(N, N);
  const material = new THREE.MeshBasicMaterial({ map: faceTextures[f] });
  material.color.setScalar(FACE_SHADE[f]);
  const mesh = new THREE.Mesh(geometry, material);
  const fv = faceVecs[f];
  mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fv.u, fv.v, fv.n));
  mesh.position.copy(fv.n).multiplyScalar(HALF + 0.003);
  cubeGroup.add(mesh);
  faceMeshes.push(mesh);
}

const edgeLines = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(N + 0.02, N + 0.02, N + 0.02)),
  new THREE.LineBasicMaterial({ color: 0x241d3d })
);
cubeGroup.add(edgeLines);

/* ---------- ORIENTAÇÃO E WIGGLE ---------- */
const WORLD_UP = new THREE.Vector3(0, 1, 0);
const camDir = new THREE.Vector3();
const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();
const dirT = new THREE.Vector3();
const rightT = new THREE.Vector3();
const upT = new THREE.Vector3();
const presU = new THREE.Vector3();
const presV = new THREE.Vector3();
const targetQuat = new THREE.Quaternion();
const smoothedQuat = new THREE.Quaternion();
const wobbleQuat = new THREE.Quaternion();
const wobbleEuler = new THREE.Euler();
const matF = new THREE.Matrix4();
const matT = new THREE.Matrix4();
/* Inclinação do cubo em relação à câmera: vista diagonal, com as faces
   vizinhas aparecendo (sem isso a face fica "de frente" e parece mapa 2D). */
const TILT_RIGHT = 0.30;
const TILT_UP = 0.30;
/* Duração da rolagem ao trocar de face (o controle é sempre relativo à face
   exibida, então o visor precisa assentar rápido). */
const ROT_TIME = 0.22;
/* Mola do balanço: leve e lenta, para o cubo "aparecer" nas transições. */
const WOBBLE_K = 5.0;
const WOBBLE_C = 3.2;

let wobble = new THREE.Vector3();
let wobbleVel = new THREE.Vector3();
let pop = 0;
const rotFrom = new THREE.Quaternion();
let rotFace = -1;
let rotElapsed = ROT_TIME;

function kickWobble() {
  wobbleVel.x += (Math.random() - 0.5) * 0.39;
  wobbleVel.y += (Math.random() - 0.5) * 0.48;
  wobbleVel.z += (Math.random() - 0.5) * 0.30;
}

function computeTargetQuat(out) {
  const faceIndex = snake ? snake.cells[0].f : 0;
  const fv = faceVecs[faceIndex];
  camDir.copy(camera.position).normalize();
  camRight.crossVectors(WORLD_UP, camDir).normalize();
  camUp.crossVectors(camDir, camRight).normalize();

  dirT.copy(camDir).addScaledVector(camRight, TILT_RIGHT).addScaledVector(camUp, TILT_UP).normalize();
  rightT.copy(camRight).addScaledVector(dirT, -camRight.dot(dirT)).normalize();
  upT.crossVectors(dirT, rightT).normalize();

  presentedFrame(faceIndex, presU, presV);

  matF.makeBasis(presU, presV, fv.n);
  matT.makeBasis(rightT, upT, dirT);
  matT.multiply(matF.transpose());
  out.setFromRotationMatrix(matT);
}

function syncCube(immediate) {
  computeTargetQuat(targetQuat);
  if (immediate) {
    smoothedQuat.copy(targetQuat);
    rotFace = snake ? snake.cells[0].f : 0;
    rotElapsed = ROT_TIME;
  }
}

function updateCube(dt) {
  const targetFace = snake ? snake.cells[0].f : 0;
  computeTargetQuat(targetQuat);

  /* Transição de face com duração fixa: o cubo gira rápido e depois FICA
     parado na face atual (sem sobra de movimento), para o controle nunca
     ficar ambíguo enquanto o jogador está decidindo numa face. */
  if (targetFace !== rotFace) {
    rotFace = targetFace;
    rotFrom.copy(smoothedQuat);
    rotElapsed = 0;
  }
  if (reduceMotion) {
    smoothedQuat.copy(targetQuat);
    rotElapsed = ROT_TIME;
  } else if (rotElapsed < ROT_TIME) {
    rotElapsed = Math.min(ROT_TIME, rotElapsed + dt);
    const p = rotElapsed / ROT_TIME;
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    smoothedQuat.slerpQuaternions(rotFrom, targetQuat, e);
  }

  if (reduceMotion) {
    wobble.set(0, 0, 0);
    wobbleVel.set(0, 0, 0);
    wobbleQuat.identity();
  } else {
    /* mola leve: o cubo balança devagar depois de rolar e vai assentando */
    wobbleVel.x += (-WOBBLE_K * wobble.x - WOBBLE_C * wobbleVel.x) * dt;
    wobbleVel.y += (-WOBBLE_K * wobble.y - WOBBLE_C * wobbleVel.y) * dt;
    wobbleVel.z += (-WOBBLE_K * wobble.z - WOBBLE_C * wobbleVel.z) * dt;
    wobble.addScaledVector(wobbleVel, dt);
    wobbleEuler.set(
      wobble.x + Math.sin(animTime * 0.0007) * 0.002,
      wobble.y + Math.sin(animTime * 0.0005 + 1.3) * 0.0025,
      wobble.z + Math.sin(animTime * 0.0009 + 2.1) * 0.0015
    );
    wobbleQuat.setFromEuler(wobbleEuler);
  }
  cubeGroup.quaternion.copy(smoothedQuat).multiply(wobbleQuat);

  pop *= Math.exp(-dt * 7);
  cubeGroup.scale.setScalar(1 + pop);

  camera.position.copy(CAM_DIR).multiplyScalar(camDist);
  if (!reduceMotion) {
    camera.position.x += Math.sin(animTime * 0.0007) * 0.15;
    camera.position.y += Math.sin(animTime * 0.0009 + 1.7) * 0.12;
    camera.position.z += Math.cos(animTime * 0.0006 + 0.5) * 0.15;
  }
  if (animTime < shakeUntil) {
    const k = (shakeUntil - animTime) / 300;
    camera.position.x += (Math.random() - 0.5) * 3 * k;
    camera.position.y += (Math.random() - 0.5) * 3 * k;
  }
  camera.lookAt(0, 0, 0);

  /* Com o ângulo diagonal a face exibida sai do centro da tela; desloca-se o
     grupo (translação pura) para o conjunto face + vizinhas ficar centrado. */
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const aspect = window.innerWidth / window.innerHeight;
  cubeGroup.position
    .copy(camRight).multiplyScalar(-0.11 * camDist * tanH * aspect)
    .addScaledVector(camUp, -0.105 * camDist * tanH);
}

/* ---------- ROTINAS DE PERIGO E CAOS ---------- */
let instavelTimer = 0;

function spawnHazard() {
  for (let attempt = 0; attempt < 12; attempt++) {
    const f = randInt(0, FACE_COUNT - 1);
    const hx = randInt(0, N - 3);
    const hy = randInt(0, N - 3);
    const head = snake.cells[0];
    const coversHead = head.f === f && head.x >= hx && head.x < hx + 3 && head.y >= hy && head.y < hy + 3;
    const coversApple = apple && apple.f === f && apple.x >= hx && apple.x < hx + 3 && apple.y >= hy && apple.y < hy + 3;
    if (coversHead || coversApple) continue;
    hazard = { f, x: hx, y: hy, state: 'warn', until: gameTime + HAZARD_WARNING };
    audio.danger();
    showBanner('ZONA DE PERIGO', 'SAIA DA ÁREA VERMELHA', HAZARD_WARNING);
    return;
  }
  nextHazardAt = gameTime + 3000;
}

function updateInstavel(dt) {
  instavelTimer -= dt * 1000;
  if (instavelTimer > 0) return;
  instavelTimer = 4000 + Math.random() * 3000;

  const unstableFaces = [];
  for (let f = 0; f < FACE_COUNT; f++) {
    if (faceEffects[f] === 'instavel') unstableFaces.push(f);
  }
  if (!unstableFaces.length) return;

  const f = pick(unstableFaces);
  const head = snake.cells[0];
  for (let attempt = 0; attempt < 24; attempt++) {
    const x = randInt(0, N - 1);
    const y = randInt(0, N - 1);
    if (isOnSnake(f, x, y) || isBlockAt(f, x, y)) continue;
    if (apple && apple.f === f && apple.x === x && apple.y === y) continue;
    if (powerup && powerup.f === f && powerup.x === x && powerup.y === y) continue;
    if (isHazardAt(f, x, y)) continue;
    if (head.f === f && Math.max(Math.abs(head.x - x), Math.abs(head.y - y)) < 2) continue;
    tempBlocks.push({ f, x, y, warnUntil: animTime + 1100, until: animTime + 9000 });
    return;
  }
}

function resolveSwap() {
  pendingSwap = false;
  assignEffects(false);
  swapsSince = 0;
  nextSwapAt = randInt(2, 4);
  pop = Math.max(pop, 0.075);
  audio.swap();
  wobbleVel.y += (Math.random() < 0.5 ? -1 : 1) * 1.6;
  showBanner('FACES TROCADAS', 'NOVOS EFEITOS ATIVOS', 1300);
  updateHUD();
}

/* ---------- LOOP ---------- */
function drawAllFaces() {
  for (let f = 0; f < FACE_COUNT; f++) drawFace(f);
}

let lastFrame = performance.now();

function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  animTime += dt * 1000;

  if (state === 'playing') {
    gameTime += dt * 1000;
    acc += dt * 1000;

    let guard = 0;
    while (state === 'playing' && acc >= currentTick() && guard < 6) {
      acc -= currentTick();
      step();
      guard++;
    }

    if (powerup && gameTime >= powerup.expiresAt) powerup = null;

    if (pendingSwap && gameTime >= swapWarningUntil) resolveSwap();

    if (!hazard && gameTime >= nextHazardAt) spawnHazard();
    if (hazard && gameTime >= hazard.until) {
      if (hazard.state === 'warn') {
        hazard.state = 'live';
        hazard.until = gameTime + HAZARD_LIFE;
      } else {
        hazard = null;
        nextHazardAt = gameTime + Math.max(8000, 15000 - applesTotal * 150);
      }
    }

    updateInstavel(dt);
    updateParticles(dt);
  } else if (state !== 'paused') {
    updateParticles(dt);
  }

  for (let i = tempBlocks.length - 1; i >= 0; i--) {
    if (animTime >= tempBlocks[i].until) tempBlocks.splice(i, 1);
  }

  updateEffectBars();
  updateCube(dt);
  drawAllFaces();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

        '<b>← ↑ ↓ →</b> / <b>WASD</b> MOVEM NA DIREÇÃO DA TELA<br>' +
        '<b>DESLIZE</b> A TELA PARA MUDAR DE DIREÇÃO · <b>P</b> PAUSA · <b>M</b> SOM</p>' +
        '<p class="best">RECORDE<b>' + pad(highScore) + '</b></p>' +
        '<button class="btn" data-action="start" type="button">JOGAR</button>' +
      '</div>';
  }
  if (kind === 'paused') {
    return '' +
      '<div class="panel">' +
        '<p class="kicker">PAUSA</p>' +
        '<h2 class="title pause">EM ESPERA</h2>' +

      '<div class="panel">' +
        '<p class="kicker">FIM DE JOGO</p>' +

        '<div class="score-grid">' +
          '<div><span>SCORE</span><b>' + pad(score) + '</b></div>' +
          '<div><span>RECORDE</span><b>' + pad(highScore) + '</b></div>' +

        '<button class="btn" data-action="start" type="button">JOGAR DE NOVO</button>' +

function showOverlay(kind) {
  const markup = overlayMarkup(kind);
  if (!markup) return;
  overlay.innerHTML = markup;
  overlay.hidden = false;
  const primary = overlay.querySelector('.btn');
  if (primary) setTimeout(() => primary.focus(), 40);
}

function hideOverlay() {
  overlay.hidden = true;
  overlay.innerHTML = '';
}

overlay.addEventListener('click', (event) => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  audio.ensure();
  audio.click();
  const action = button.dataset.action;
  if (action === 'start') startGame();
  else if (action === 'resume') togglePause();
});

/* ---------- CONTROLES ---------- */
function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    showOverlay('paused');
  } else if (state === 'paused') {
    state = 'playing';
    hideOverlay();
    acc = 0;
    lastFrame = performance.now();
  }
}

function toggleMute() {
  muted = !muted;
  store.set('cobrinhaCubo.muted', muted ? '1' : '0');
  updateMuteButton();
  if (!muted) {
    audio.ensure();
    audio.click();
  }
}

function updateMuteButton() {
  muteBtn.textContent = muted ? 'SOM OFF' : 'SOM ON';
  muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
}

muteBtn.addEventListener('click', () => { audio.ensure(); toggleMute(); });

window.addEventListener('keydown', (event) => {
  const raw = event.key;
  const key = raw.length === 1 ? raw.toLowerCase() : raw;
  if (raw === 'ArrowUp' || raw === 'ArrowDown' || raw === 'ArrowLeft' || raw === 'ArrowRight' || raw === ' ') {
    event.preventDefault();
  }
  if (event.repeat) return;
  audio.ensure();

  if (key === 'm') { toggleMute(); return; }
  if (key === 'p' || raw === ' ') {
    if (state === 'playing' || state === 'paused') { togglePause(); return; }
  }
  if (raw === 'Enter' || key === 'r') {
    if (state === 'menu' || state === 'gameover') { startGame(); return; }
    if (key === 'r' && (state === 'playing' || state === 'paused')) { startGame(); return; }
  }
  if (state !== 'playing') return;
  if (key === 'ArrowUp' || key === 'w') inputDir(0, 1);
  else if (key === 'ArrowDown' || key === 's') inputDir(0, -1);
  else if (key === 'ArrowLeft' || key === 'a') inputDir(-1, 0);
  else if (key === 'ArrowRight' || key === 'd') inputDir(1, 0);
});

sceneWrap.addEventListener('pointerdown', (event) => {
  if (state !== 'playing') return;
  swipeStart = { x: event.clientX, y: event.clientY };
});

sceneWrap.addEventListener('pointerup', (event) => {
  if (!swipeStart || state !== 'playing') { swipeStart = null; return; }
  const dx = event.clientX - swipeStart.x;
  const dy = event.clientY - swipeStart.y;
  swipeStart = null;
  const ax = Math.abs(dx);
  const ay = Math.abs(dy);
  if (Math.max(ax, ay) < 24) return;
  if (ax >= ay) inputDir(dx < 0 ? -1 : 1, 0);
  else inputDir(0, dy < 0 ? 1 : -1);
});

sceneWrap.addEventListener('pointercancel', () => { swipeStart = null; });
window.addEventListener('blur', () => { if (state === 'playing') togglePause(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') togglePause();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camDist = computeCamDist();
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- MUNDO ---------- */
function initWorld() {
  score = 0;
  applesTotal = 0;
  gameTime = 0;
  acc = 0;
  tickBase = TICK_START;
  effect = { slowUntil: 0, shieldUntil: 0 };
  particles = [];
  tempBlocks = [];
  hazard = null;
  pendingSwap = false;
  swapWarningUntil = 0;
  deathCause = '';
  shakeUntil = 0;
  flashUntil = 0;
  instavelTimer = 0;
  snake = {
    cells: [
      { f: 0, x: 4, y: 4 }, { f: 0, x: 3, y: 4 },
      { f: 0, x: 2, y: 4 }, { f: 0, x: 1, y: 4 }
    ],
    dir: new THREE.Vector3(1, 0, 0)
  };
  turns = [];
  faceSpin.fill(0);
  apple = null;
  powerup = null;
  nextPowerupAt = randInt(3, 5);
  assignEffects(true);
  swapsSince = 0;
  nextSwapAt = randInt(2, 4);
  nextHazardAt = gameTime + 11000;
  obstacles = generateObstacles();
  spawnApple();
}

/* ---------- BOOT ---------- */
window.__cuboBoot = true;
initWorld();
/* O menu é uma vitrine: efeitos fixos e vistosos na face visível */
faceEffects = ['turbo', 'portal', 'dourada', 'nevoa', 'lama', 'neutra'];
state = 'menu';
updateMuteButton();
updateHUD();
updateEffectBars();
showOverlay('menu');
syncCube(true);
requestAnimationFrame(frame);
</script>
</body>
